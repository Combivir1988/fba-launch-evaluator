<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<body class="share-page">

  <div class="brand">📦 FBA Launch Evaluator <span class="muted share-tag">отчёт · только чтение</span></div>
  <nav></nav>

    <p>Её не существует, она отозвана или истёк срок действия. Попросите отправителя прислать новую ссылку.</p>
  </section>
</main>
<div id="toast" class="toast hidden" role="status"></div>

<script src="/js/render.js"></script>
<script type="module" src="/js/share.js"></script>
